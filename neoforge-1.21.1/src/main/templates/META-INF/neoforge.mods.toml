modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="luchomart"
description='''
Traduce al español los textos de tus mods, desde cualquier idioma, usando una IA: en tu PC (Ollama, LM Studio) o en la nube (Gemini, Groq, OpenRouter).

- Usa el español del juego: España, México, Argentina, Chile, Uruguay, Venezuela o Ecuador.
- Respeta las traducciones oficiales y aprovecha otras variantes del español antes de traducir.
- Traduce también los libros y guías del juego (Patchouli, Tinkers' Construct, AE2, Immersive Engineering…) y las misiones de FTB Quests.
- Un asistente te guía la primera vez. Solo se traduce lo nuevo.

Abrí "Configuración" para elegir la IA y ver el progreso. Comandos: /traductor
'''
logoFile="traductor_es.png"
logoBlur=false
credits="Hecho con ayuda de IA (Claude, de Anthropic)."

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.0,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
