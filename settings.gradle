pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'traductor-es'
include 'neoforge-1.21.1', 'forge-1.20.1', 'fabric-1.21.1', 'fabric-1.20.1'
